# Define the server block configuration
server {
    # Nginx listens on port 80 inside the container
    listen 80;
    
    # Set the root directory for serving static files (Angular assets)
    root /usr/share/nginx/html;
    index index.html;

    # 1. Angular Routing and Static Files
    # This block ensures Angular's client-side routing works by falling back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy for API Calls
    # All requests starting with /api/ will be proxied to the backend service.
    # CRITICAL: 'api' is the Docker Compose service name of your backend.
    # We use 'http://api/' to forward the request to the root of the 'api' service.
    location /api/ {
        # The proxy_pass directive redirects the request to the backend container.
        proxy_pass http://api:8000/; 
        
        # Standard proxy headers to correctly pass host, IP, and protocol info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for potentially long API calls
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}